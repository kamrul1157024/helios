name: Test

# Every check that used to be run by hand before a merge. The three suites are
# separate jobs so a Dart failure does not hide a Go one.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three manifests carry one number between them, and it has to be past the
  # newest release. Nobody is asked to remember that: the bump is made here and
  # pushed back to the branch, so a revert or a hand-edited manifest cannot leave
  # a release nobody can install over.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The head branch, wherever it lives, and not the merge commit a PR
          # checkout defaults to: a detached HEAD has nowhere to push the bump.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Bump if it needs bumping
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-version.sh --fix
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      # A fork's branch is not ours to write to, so those PRs are told rather
      # than fixed.
      - name: Push the bump
        id: push
        if: >-
          steps.bump.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      # Said out loud, because the branch now has a commit its author did not
      # write, and a silent one is the kind that gets force-pushed away.
      - name: Say so on the PR
        if: steps.push.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "Bumped the version to \`${{ steps.bump.outputs.version }}\` and pushed it to this branch — \`VERSION\`, \`desktop/package.json\` and \`mobile/pubspec.yaml\` move together, and the number has to be past the newest release. Pull before you push again."

      - name: Ask the fork to do it
        if: steps.bump.outputs.changed == 'true' && steps.push.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body \
            "The version needs to be \`${{ steps.bump.outputs.version }}\` — run \`./scripts/check-version.sh --fix\` and push. This branch is on a fork, so CI cannot do it for you."
          exit 1

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the test script strips types at runtime, which older
          # Node refuses to do.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      - run: npm run typecheck
        working-directory: desktop

      - run: npm test
        working-directory: desktop

      - run: npm run build
        working-directory: desktop

  desktop-e2e:
    name: Desktop e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      # Electron is a browser, and a runner has no display or the libraries one
      # would draw with. Playwright's own installer knows which they are.
      - run: npx playwright install-deps chromium
        working-directory: desktop

      # xvfb-run, not a headless flag: Electron has no headless mode, and the
      # app under test is the real window the user would see.
      - run: xvfb-run -a npm run e2e
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: desktop/test-results/
          retention-days: 7

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # Infos are not failures: CI tracks stable, which runs ahead of the
      # SDK on a developer's machine, and its deprecation notices land as
      # infos for APIs that machine does not have a replacement for yet.
      # Warnings and errors still fail.
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile

      - run: flutter test
        working-directory: mobile
