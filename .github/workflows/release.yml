name: Release

# No version input: the number was decided in the PR that earned it and lives in
# VERSION. Typing it again here is where the tag, the APK's build name and the
# app's own number end up as three different numbers.
#
# Runs itself once main is green. A release nobody has to remember to cut is one
# that goes out while the change is still fresh, and the gate below makes it a
# no-op when the number in VERSION is already released.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  # Whether there is anything to release, decided once rather than in four jobs.
  gate:
    name: Release?
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(cat VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "v$v is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v has not been released yet."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Android APK
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # `make apk-release` derives the Android build number from
          # `git rev-list --count HEAD`, which a shallow clone reports as 1.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: cd mobile && flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/helios-release.jks

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: helios-release.jks
        run: make apk-release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  desktop-mac:
    name: Desktop (macOS)
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # electron-builder stamps this into the app, which reports it to the
      # update check; a checkout past a tag would otherwise describe itself as
      # the release it sits above.
      - name: Read the version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # Must match .nvmrc: `make desktop` refuses to build on anything
          # older, because the renderer's test script strips types at runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cd desktop && npm ci

      - name: Package DMGs
        env:
          # electron-builder.yml sets `identity: null`, so there is nothing to
          # find; without this it still probes the runner's empty keychain and
          # warns at length about it.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Both slices: the runner is arm64, and an Intel Mac cannot open that
        # DMG. The `--mac` is load-bearing — the arch flags are scoped to a
        # platform, and without it electron-builder silently builds the host
        # arch alone. `--publish never` stops it creating a release of its own,
        # which the publish job below owns.
        run: make desktop-app DESKTOP_DIST_FLAGS="--mac --arm64 --x64 --publish never"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Read the version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # Must match .nvmrc: `make desktop` refuses to build on anything
          # older, because the renderer's test script strips types at runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cd desktop && npm ci

      - name: Package AppImage and deb
        # Targets come from electron-builder.yml; the runner is x64, which is
        # the only Linux arch this ships.
        run: make desktop-app DESKTOP_DIST_FLAGS="--linux --publish never"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [gate, apk, desktop-mac, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # The changelog covers the commits since the last tag, so both the
          # tags and the history behind them have to be here.
          fetch-depth: 0

      - name: Read the version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        # Asset names are version-free on purpose: the landing page and the
        # README link `releases/latest/download/<name>`, which only resolves if
        # the name is the same in every release. electron-builder stamps the
        # version into what it produces, so it is dropped here.
        run: |
          mkdir -p dist
          mv artifacts/apk/app-release.apk dist/helios.apk
          for file in artifacts/desktop-mac/* artifacts/desktop-linux/*; do
            case "$file" in
              *arm64.dmg) mv "$file" dist/helios-desktop-macos-arm64.dmg ;;
              *x64.dmg)   mv "$file" dist/helios-desktop-macos-x64.dmg ;;
              *.AppImage) mv "$file" dist/helios-desktop-linux-x86_64.AppImage ;;
              *.deb)      mv "$file" dist/helios-desktop-linux-amd64.deb ;;
              *) echo "unexpected artifact: $file" >&2; exit 1 ;;
            esac
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-publish
