name: Release

# Cut by hand, on purpose. A merge to main is not a release: the work collects
# there until somebody decides the batch is worth shipping and presses the
# button.
#
# No version to type either — only which part of the number moves. The step is
# always one, everything to the right of it goes to zero, and the base is the
# newest release. So the number cannot be mistyped, cannot skip, and cannot
# collide with a release that is already out.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the number this release moves
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # What this release is called, decided once rather than in four jobs.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, and the history behind them: the guard below asks whether
          # anything has landed since the newest one.
          fetch-depth: 0

      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(./scripts/next-version.sh "${{ inputs.bump }}")
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # A tag without a release behind it — a draft, or one pushed by hand —
          # would otherwise be reused, and this release would carry somebody
          # else's commit.
          if git rev-parse "v$v" > /dev/null 2>&1; then
            echo "Tag v$v already exists, but no release is published for it." >&2
            echo "Delete the tag or pick a different part of the number." >&2
            exit 1
          fi

          # Pressing twice in a row would otherwise cut a second release with an
          # empty changelog behind it.
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last" ]; then
            count=$(git rev-list "$last..HEAD" --count)
            if [ "$count" -eq 0 ]; then
              echo "Nothing to release: no commits since $last." >&2
              exit 1
            fi
            echo "Releasing **v$v** (\`${{ inputs.bump }}\`) — $count commits since $last." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing **v$v** (\`${{ inputs.bump }}\`) — the first release." >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `make apk-release` derives the Android build number from
          # `git rev-list --count HEAD`, which a shallow clone reports as 1.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: cd mobile && flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/helios-release.jks

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: helios-release.jks
        run: make apk-release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  desktop-mac:
    name: Desktop (macOS)
    needs: version
    runs-on: macos-latest
    # electron-builder stamps this into the app, which reports it to the update
    # check; the number in package.json is a placeholder the build overrides.
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match .nvmrc: `make desktop` refuses to build on anything
          # older, because the renderer's test script strips types at runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cd desktop && npm ci

      - name: Package DMGs
        env:
          # electron-builder.yml sets `identity: null`, so there is nothing to
          # find; without this it still probes the runner's empty keychain and
          # warns at length about it.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Both slices: the runner is arm64, and an Intel Mac cannot open that
        # DMG. The `--mac` is load-bearing — the arch flags are scoped to a
        # platform, and without it electron-builder silently builds the host
        # arch alone. `--publish never` stops it creating a release of its own,
        # which the publish job below owns.
        run: make desktop-app DESKTOP_DIST_FLAGS="--mac --arm64 --x64 --publish never"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match .nvmrc: `make desktop` refuses to build on anything
          # older, because the renderer's test script strips types at runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cd desktop && npm ci

      - name: Package AppImage and deb
        # Targets come from electron-builder.yml; the runner is x64, which is
        # the only Linux arch this ships.
        run: make desktop-app DESKTOP_DIST_FLAGS="--linux --publish never"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, apk, desktop-mac, desktop-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog covers the commits since the last tag, so both the
          # tags and the history behind them have to be here.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        # Asset names are version-free on purpose: the landing page and the
        # README link `releases/latest/download/<name>`, which only resolves if
        # the name is the same in every release. electron-builder stamps the
        # version into what it produces, so it is dropped here.
        run: |
          mkdir -p dist
          mv artifacts/apk/app-release.apk dist/helios.apk
          for file in artifacts/desktop-mac/* artifacts/desktop-linux/*; do
            case "$file" in
              *arm64.dmg) mv "$file" dist/helios-desktop-macos-arm64.dmg ;;
              *x64.dmg)   mv "$file" dist/helios-desktop-macos-x64.dmg ;;
              *.AppImage) mv "$file" dist/helios-desktop-linux-x86_64.AppImage ;;
              *.deb)      mv "$file" dist/helios-desktop-linux-amd64.deb ;;
              *) echo "unexpected artifact: $file" >&2; exit 1 ;;
            esac
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-publish
