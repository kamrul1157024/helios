name: helios
description: Helios mobile app — orchestrate AI coding agents from your phone.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.8.0
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter
  # HTTP client
  http: ^1.4.0
  # QR code scanner
  mobile_scanner: ^7.0.1
  # Secure storage for keys
  flutter_secure_storage: ^9.2.4
  # Local notifications
  flutter_local_notifications: ^19.1.0
  # Foreground service (Android)
  flutter_foreground_task: ^9.0.2
  # Cryptography (Ed25519)
  cryptography: ^2.7.0
  # UUID generation
  uuid: ^4.5.1
  # URL launcher
  url_launcher: ^6.3.1
  # Deep link handling
  app_links: ^6.4.0
  # Permission handler
  permission_handler: ^11.4.0
  # State management
  provider: ^6.1.4
  # Shared preferences
  shared_preferences: ^2.5.3
  # Markdown rendering
  flutter_markdown: ^0.7.6
  # HTML preview: a webview to render the page, and a parser to rewrite it
  # before it gets there. See docs/specs/51-file-previews.md.
  webview_flutter: ^4.10.0
  html: ^0.15.5
  # Syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # Speech-to-text (voice input)
  speech_to_text: ^7.0.0
  # App version info
  package_info_plus: ^8.3.0
  # Open files (APK installer)
  open_file: ^3.5.10
  # Temp/cache directory for APK download
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  xterm: ^4.0.0
  web_socket_channel: ^3.0.3
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # A real terminal face, because Android's "monospace" is Droid Sans Mono:
  # its box-drawing characters do not join, which is most of what a TUI is
  # made of. JetBrains Mono is SIL OFL 1.1 — see JetBrainsMono-OFL.txt.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
